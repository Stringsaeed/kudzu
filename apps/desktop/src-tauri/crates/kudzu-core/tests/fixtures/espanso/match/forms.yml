# Espanso forms fixture (both shorthand form: and verbose type: form)
matches:
  - trigger: ":greet"
    label: "Birthday Greeting"
    form: "Hey [[name]], [[note]]!"
    form_fields:
      name:
        default: "Friend"
      note:
        multiline: true
        default: "Happy Birthday"

  - trigger: ":order"
    label: "Order Drink"
    form: "Order: [[drink]] ([[size]])"
    form_fields:
      drink:
        type: choice
        values:
          - "Coffee"
          - "Tea|Green"
          - "Juice"
        default: "Coffee"
      size:
        type: list
        values: |
          Small
          Medium
          Large

  - trigger: ":verbose_form"
    label: "Verbose Form"
    replace: "Hi {{form1.user}}, role: {{form1.role}}"
    vars:
      - name: form1
        type: form
        params:
          layout: "User: [[user]]\nRole: [[role]]"
          fields:
            user:
              default: "Admin"
            role:
              type: choice
              values:
                - "Developer"
                - "Designer"
              default: "Developer"
