# Dates, clipboard, nested matches, and global_vars
matches:
  - trigger: ":now"
    label: "Current Time"
    replace: "It's {{mytime}}"
    vars:
      - name: mytime
        type: date
        params:
          format: "%H:%M"

  - trigger: ":tomorrow"
    label: "Tomorrow Date"
    replace: "Tomorrow is {{tom}}"
    vars:
      - name: tom
        type: date
        params:
          format: "%Y-%m-%d"
          offset: 86400
          locale: "en_US"

  - trigger: ":full_date"
    replace: "{{dt}}"
    vars:
      - name: dt
        type: date
        params:
          format: "%A, %B %e, %Y %I:%M:%S %p (%a %b %d '%y day %j %Z %z) 100%%"

  - trigger: ":paste_link"
    label: "HTML Link from Clipboard"
    replace: "<a href=\"{{clip}}\">$|$</a>"
    vars:
      - name: clip
        type: clipboard

  - trigger: ":nested_sig"
    label: "Nested Signature"
    replace: "Thanks!\n{{sig_var}}"
    vars:
      - name: sig_var
        type: match
        params:
          trigger: ":sig"
