# Realistic Espanso base match file
imports:
  - "./_private.yml"

global_vars:
  - name: company_date
    type: date
    params:
      format: "%Y-%m-%d"

matches:
  - trigger: ":sig"
    label: "Email Signature"
    replace: |
      Best regards,
      Jane Doe

  - triggers: [":hello", ":hi"]
    replace: "Hello there!"
    word: true
    propagate_case: true

  - trigger: "ther"
    replace: "there"
    word: true
    propagate_case: true

  - trigger: ":div"
    label: "HTML Div"
    replace: "<div>$|$</div>"
    force_mode: keys

  - trigger: ":escaped"
    replace: "Literal braces \\{\\{not_a_var}} here"
