[package]
name = "kudzu-app"
description = "Kudzu — a fast, keyboard-first text expander (native Rune app)."
version.workspace = true
edition = "2024"
license.workspace = true

[[bin]]
name = "kudzu"
path = "src/main.rs"

[dependencies]
kudzu-core = { path = "../kudzu-core" }
kudzu-engine = { path = "../kudzu-engine" }
# Rune is pre-release: pin a `dev` rev (never rewritten). Bump deliberately.
rune = { git = "https://github.com/anomalyco/rune", rev = "250597b0a591881b5c0138370cbd5f405ed710db", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "250597b0a591881b5c0138370cbd5f405ed710db" }
rune-mac = { git = "https://github.com/anomalyco/rune", rev = "250597b0a591881b5c0138370cbd5f405ed710db" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
log.workspace = true
parking_lot = "0.12"
base64 = "0.22"
# Already in the lockfile through tauri-plugin-updater: verifies the release signature.
minisign-verify = "0.3"
# Already in the lockfile through Rune.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSDictionary", "NSError", "NSString", "NSValue", "NSObject", "NSDate", "NSKeyedArchiver", "NSBundle", "block2"] }
block2 = "0.6"
objc2-cloud-kit = { version = "0.3", default-features = false, features = ["std", "block2", "CKContainer", "CKDatabase", "CKDefines", "CKError", "CKRecord", "CKRecordID", "CKRecordZone", "CKRecordZoneID", "CKServerChangeToken", "CKSyncEngine", "CKSyncEngineConfiguration", "CKSyncEngineEvent", "CKSyncEngineRecordZoneChangeBatch", "CKSyncEngineState"] }
