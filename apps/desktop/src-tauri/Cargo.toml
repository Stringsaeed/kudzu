[package]
name = "kudzu-desktop"
description = "Kudzu — a fast, keyboard-first text expander (Tauri app)."
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "kudzu-desktop"

[lib]
name = "kudzu_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kudzu-core = { path = "crates/kudzu-core" }
kudzu-engine = { path = "crates/kudzu-engine" }
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
log.workspace = true
base64 = "0.22"
parking_lot = "0.12"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["time", "sync"] }
tauri-plugin-log = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSDictionary", "NSError", "NSKeyedArchiver", "NSString", "NSValue", "NSObject", "NSDate", "block2"] }
objc2-cloud-kit = { version = "0.3", default-features = false, features = ["std", "block2", "CKContainer", "CKDatabase", "CKDefines", "CKError", "CKRecord", "CKRecordID", "CKRecordZone", "CKRecordZoneID", "CKServerChangeToken", "CKSyncEngine", "CKSyncEngineConfiguration", "CKSyncEngineEvent", "CKSyncEngineRecordZoneChangeBatch", "CKSyncEngineState"] }
block2 = "0.6"

[workspace]
resolver = "2"
members = ["crates/kudzu-core", "crates/kudzu-engine", "crates/kudzu-app"]

# Crate versions are internal. The app version lives in desktop/package.json (bumped by
# release-please) and reaches the bundle through tauri.conf.json's `"version": "../package.json"`.
[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true

[profile.dev.package."*"]
opt-level = 2
