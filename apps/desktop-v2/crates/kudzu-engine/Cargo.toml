[package]
name = "kudzu-engine"
description = "Kudzu's system-wide expansion engine for macOS: listener, matching, insertion, pasteboard, permissions."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kudzu-core = { path = "../kudzu-core" }
uuid.workspace = true
chrono.workspace = true
log.workspace = true
unicode-segmentation = "1"
core-foundation = "0.10"
core-foundation-sys = "0.8"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSEnumerator",
    "NSObject",
    "NSString",
    "NSURL",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSRunningApplication",
    "NSWorkspace",
] }
