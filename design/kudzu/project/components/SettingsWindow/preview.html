<!-- @dsCard group="Showcase" height=800 width=1240 page subtitle="Click around: sidebar, list, settings" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SettingsWindow</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400;500&display=swap"><style>
html,body{height:100%}
body{background:var(--canvas);overflow:hidden}
.desk{position:relative;height:100%;padding:36px 40px;box-sizing:border-box;overflow:hidden}
.desk-art{position:absolute;inset:0;pointer-events:none}
.desk-art i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.9}
.desk-art i:nth-child(1){width:520px;height:520px;left:-120px;top:-160px;background:var(--vine-soft)}
.desk-art i:nth-child(2){width:420px;height:420px;left:60px;bottom:-200px;background:var(--bloom-soft)}
.desk-art i:nth-child(3){width:200px;height:260px;left:40px;top:220px;background:var(--vine);opacity:.35}
.desk-art i:nth-child(4){width:600px;height:500px;right:-200px;top:-100px;background:var(--surface-sunken)}
#root{position:relative;height:100%}
.demo-title{width:100%;border:0;outline:0;padding:0;margin:0;background:transparent;color:var(--ink);font:600 20px/26px var(--font-mono);letter-spacing:-.01em}
.demo-preview{padding:12px 14px;border-radius:var(--radius-lg);background:var(--surface-sunken);font:400 14px/22px var(--font-sans);color:var(--ink);white-space:pre-wrap}
.demo-fav{color:var(--bloom)}
</style></head>
<body>
<div class="desk"><div class="desk-art" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div id="root"></div></div>
<script>
var K = window.Kudzu, h = React.createElement, useState = React.useState;
var SNIPS = [
  { id: 'an', name: ':an', triggers: [':an'], group: 'base', uses: 1, fav: true, preview: 'Muhammed Saeed', content: ['Muhammed Saeed'] },
  { id: 'date', name: ':date', triggers: [':date'], group: 'base', fav: true, preview: '2 Nov 2026', content: [{ tag: '{date:%d %b %Y}' }] },
  { id: 'espanso', name: ':espanso', triggers: [':espanso'], group: 'base', fav: true, preview: 'Hi there!', content: ['Hi there!'] },
  { id: 'fn', name: ':fn', triggers: [':fn'], group: 'base', preview: 'Muhammed Ahmed Saeed', content: ['Muhammed Ahmed Saeed'] },
  { id: 'gh', name: ':gh', triggers: [':gh'], group: 'base', preview: 'github.com/Stringsaeed', content: ['github.com/Stringsaeed'] },
  { id: 'm', name: ':m', triggers: [':m'], group: 'base', uses: 1, preview: 'muhammed@example.com', content: ['muhammed@example.com'] },
  { id: 'shell', name: ':shell', triggers: [':shell'], group: 'base', preview: 'Output of a shell command', content: [{ tag: '{shell:git branch --show-current}' }] },
  { id: 'sig', name: 'Signature', triggers: [';sig'], group: 'Getting started', preview: 'Best, Muhammed', content: ['Best,\nMuhammed'] },
  { id: 'today', name: "Today's date", triggers: [';date'], group: 'Getting started', preview: 'Sunday, 2 November', content: [{ tag: '{date:%A, %-d %B}' }] },
  { id: 'kudzu', name: 'Kudzu test', triggers: [';kudzu', ';kz'], group: 'Getting started', preview: 'Kudzu is working.', content: ['Kudzu is working. Expanded at ', { tag: '{time}' }, ' in ', { tag: '{app}' }, '.'] }
];
var SETTINGS = [
  { id: 'general', label: 'General', icon: 'sliders' },
  { id: 'sync', label: 'Sync', icon: 'cloud' },
  { id: 'backups', label: 'Backups', icon: 'history' },
  { id: 'io', label: 'Import & export', icon: 'tray' },
  { id: 'about', label: 'About', icon: 'info' }
];

function Sidebar(p) {
  var v = p.view, go = p.go;
  return h(React.Fragment, null,
    h(K.SidebarSection, null,
      h(K.SidebarItem, { icon: 'stack', label: 'All snippets', count: 18, active: v === 'all', onClick: function () { go('all'); } }),
      h(K.SidebarItem, { icon: 'star', label: 'Favorites', count: 3, active: v === 'favorites', onClick: function () { go('favorites'); } }),
      h(K.SidebarItem, { icon: 'clock', label: 'Recently used', active: v === 'recent', onClick: function () { go('recent'); } }),
      h(K.SidebarItem, { icon: 'chart', label: 'Stats', active: v === 'stats', onClick: function () { go('stats'); } })),
    h(K.SidebarSection, { label: 'Groups', action: h(K.IconButton, { icon: 'plus', label: 'New group', size: 'sm' }) },
      h(K.SidebarItem, { icon: 'folder', label: 'base', count: 15, active: v === 'base', onClick: function () { go('base'); } }),
      h(K.SidebarItem, { icon: 'folder', label: 'Getting started', count: 3, active: v === 'gs', onClick: function () { go('gs'); } })));
}

function SnippetList(p) {
  var list = SNIPS.filter(function (s) {
    if (p.view === 'favorites') return s.fav;
    if (p.view === 'recent') return s.uses;
    if (p.view === 'base') return s.group === 'base';
    if (p.view === 'gs') return s.group === 'Getting started';
    return true;
  });
  var titles = { all: 'All snippets', favorites: 'Favorites', recent: 'Recently used', base: 'base', gs: 'Getting started' };
  var counts = { all: 18, favorites: 3, recent: 2, base: 15, gs: 3 };
  return h(React.Fragment, null,
    h(K.ListHeader, { title: titles[p.view], subtitle: counts[p.view] + ' snippets', actions: h(React.Fragment, null,
      h(K.IconButton, { icon: 'sort', label: 'Sort', menu: true }),
      h(K.IconButton, { icon: 'compose', label: 'New snippet (⌘N)' })) }),
    h('div', { style: { padding: '0 12px 8px' } }, h(K.SearchField, null)),
    h('div', { role: 'listbox', style: { flex: 1, overflow: 'auto', padding: '0 8px 8px', display: 'flex', flexDirection: 'column', gap: 1 } },
      list.map(function (s) {
        return h(K.SnippetRow, { key: s.id, name: s.name, triggers: s.triggers, preview: s.preview, uses: s.uses, favorite: s.fav,
          group: p.view === 'all' || p.view === 'favorites' || p.view === 'recent' ? s.group : null,
          selected: p.sel === s.id, onClick: function () { p.select(s.id); } });
      })));
}

function SnippetDetail(p) {
  var s = SNIPS.filter(function (x) { return x.id === p.sel; })[0];
  if (!s) return h('div', { style: { flex: 1, display: 'grid', placeItems: 'center' } },
    h(K.EmptyState, { title: 'No snippet selected' }, 'Choose a snippet to edit it, or press ', h(K.Kbd, null, '⌘N'), ' to create one.'));
  var expanded = s.content.map(function (c) { return typeof c === 'string' ? c : (c.tag.indexOf('date') > -1 ? '2 Nov 2026' : c.tag.indexOf('time') > -1 ? '00:57' : c.tag.indexOf('app') > -1 ? 'Notes' : 'main'); }).join('');
  return h(React.Fragment, null,
    h('div', { className: 'kz-titlebar', style: { padding: '0 12px 0 24px', gap: 8 } },
      h('span', { style: { font: '500 11px/14px var(--font-sans)', color: 'var(--ink-muted)', display: 'flex', alignItems: 'center', gap: 6 } }, h(K.Icon, { name: 'folder', size: 12 }), s.group),
      h('span', { className: 'kz-grow' }),
      h(K.ToolbarGroup, null,
        h(K.IconButton, { icon: s.fav ? 'star-fill' : 'star', label: 'Favorite', tone: s.fav ? 'bloom' : undefined }),
        h(K.IconButton, { icon: 'bug', label: 'Debug', menu: true }),
        h('span', { className: 'kz-toolbar-sep' }),
        h(K.IconButton, { icon: 'more', label: 'More' }))),
    h('div', { style: { flex: 1, overflow: 'auto', padding: '8px 24px 24px', display: 'flex', flexDirection: 'column', gap: 20 } },
      h('input', { className: 'demo-title', defaultValue: s.name, key: s.id + 'n', 'aria-label': 'Snippet name' }),
      h(K.Field, { label: 'Triggers', aside: 'Space or return to add' }, h(K.TriggerInput, { key: s.id + 't', triggers: s.triggers })),
      h(K.Field, { label: 'Content' }, h(K.Editor, { key: s.id + 'c', value: s.content, minHeight: 120 })),
      h(K.Field, { label: 'Preview' }, h('div', { className: 'demo-preview' }, expanded)),
      h(K.Disclosure, { title: 'Rules', open: true },
        h('div', { style: { display: 'flex', alignItems: 'center', gap: 12 } },
          h(K.Segmented, { options: ['Inherit from group', 'Custom'], label: 'Rules' }),
          h('span', { style: { display: 'inline-flex', alignItems: 'center', gap: 6, color: 'var(--ink-muted)', font: '400 12px/16px var(--font-sans)' } }, h(K.Icon, { name: 'check', size: 14 }), 'Works in every app')),
        h('div', { style: { display: 'flex', alignItems: 'center', gap: 12 } },
          h('span', { style: { font: '500 13px/18px var(--font-sans)', width: 72 } }, 'Insertion'), h(K.Select, { value: 'Inherit' }))),
      h(K.Disclosure, { title: 'Advanced', open: false, summary: 'Word boundary, case, undo' }, null),
      h('div', { style: { marginTop: 'auto', paddingTop: 8, borderTop: '1px solid var(--line)', color: 'var(--ink-muted)', font: '400 11px/14px var(--font-sans)' } },
        'Created 1 Nov · Edited 2 Nov · ' + (s.uses || 0) + (s.uses === 1 ? ' expansion' : ' expansions'))));
}

function StatsList() {
  return h(React.Fragment, null,
    h(K.ListHeader, { title: 'Stats', subtitle: 'Ranked by use' }),
    h('div', { style: { padding: '0 8px', display: 'flex', flexDirection: 'column', gap: 1 } },
      h(K.ListRow, { title: h(K.TriggerChip, null, ':m'), meta: 'Last used 4 hours ago', aside: '1', selected: true }),
      h(K.ListRow, { title: h(K.TriggerChip, null, ':an'), meta: 'Last used 4 hours ago', aside: '1' })));
}
function StatsDetail() {
  return h('div', { style: { flex: 1, overflow: 'auto', padding: '8px 24px 24px' } },
    h('div', { className: 'kz-titlebar', style: { height: 44 } }, h('span', { style: { font: '600 20px/26px var(--font-sans)', letterSpacing: '-.01em' } }, 'This week')),
    h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(3, minmax(0,1fr))', gap: 12 } },
      h(K.StatTile, { icon: 'bolt', label: 'Expansions', value: '2' }),
      h(K.StatTile, { icon: 'type', label: 'Characters saved', value: '30' }),
      h(K.StatTile, { icon: 'timer', label: 'Time saved', value: '9s' })),
    h('div', { style: { marginTop: 24 } },
      h(K.SettingsGroup, { title: 'Most used' },
        h('div', { style: { padding: '12px 16px', display: 'flex', flexDirection: 'column', gap: 4 } },
          h(K.UsageBar, { label: ':m', value: 1, max: 1 }),
          h(K.UsageBar, { label: ':an', value: 1, max: 1 })))),
    h('p', { style: { display: 'flex', alignItems: 'center', gap: 8, margin: '16px 2px 0', color: 'var(--ink-muted)', font: '400 12px/16px var(--font-sans)' } },
      h(K.Icon, { name: 'keyboard', size: 14 }), 'Time saved assumes 40 words per minute. Change it in Settings › General.'));
}

function SettingsList(p) {
  return h(React.Fragment, null,
    h(K.ListHeader, { title: 'Settings', subtitle: 'Kudzu 1.0' }),
    h('div', { style: { padding: '0 8px', display: 'flex', flexDirection: 'column', gap: 1 } },
      SETTINGS.map(function (s) { return h(K.SidebarItem, { key: s.id, icon: s.icon, label: s.label, active: p.sec === s.id, onClick: function () { p.setSec(s.id); } }); })));
}
function Page(p) {
  return h('div', { style: { flex: 1, overflow: 'auto', padding: '0 32px 32px', background: 'var(--surface)' } },
    h('div', { className: 'kz-titlebar', style: { height: 'auto', padding: '20px 0 20px', display: 'block' } },
      h('div', { style: { font: '600 20px/26px var(--font-sans)', letterSpacing: '-.01em' } }, p.title),
      p.desc ? h('div', { style: { marginTop: 4, font: '400 13px/18px var(--font-sans)', color: 'var(--ink-muted)' } }, p.desc) : null),
    p.children);
}
function SettingsDetail(p) {
  var sec = p.sec;
  if (sec === 'sync') return h(Page, { title: 'Sync', desc: 'Keep your library the same on every Mac.' },
    h(K.SettingsGroup, { title: 'iCloud' },
      h(K.SettingsRow, { label: h('span', { style: { display: 'inline-flex', gap: 8, alignItems: 'center' } }, 'iCloud sync', h(K.Badge, null, 'Coming soon')), description: 'Automatic CloudKit sync across your Macs lands in milestone 4.' }, h(K.Toggle, { label: 'iCloud sync' }))),
    h(K.SettingsGroup, { title: 'This Mac' },
      h(K.SettingsRow, { label: 'Device ID' }, h('span', { style: { font: '400 11px/14px var(--font-mono)', color: 'var(--ink-muted)' } }, '9901EB70-08D6-4DC2-95DE-53CF9122E990'))));
  if (sec === 'backups') return h(Page, { title: 'Backups', desc: 'Daily snapshots of your library, plus one before every import.' },
    h(K.SettingsGroup, { title: 'Snapshots', description: 'Keeps the last 14.', action: h(K.Button, { variant: 'primary', size: 'sm', icon: 'history' }, 'Back up now') },
      h('div', { style: { padding: 4, display: 'flex', flexDirection: 'column', gap: 1 } },
        h(K.ListRow, { title: '2 Nov 2026, 00:35', meta: 'kudzu-backup-2026-11-02T003536-daily.json', aside: '18 snippets', badge: h(K.Badge, null, 'Daily'), selected: true }),
        h(K.ListRow, { title: '1 Nov 2026, 21:20', meta: 'kudzu-backup-2026-11-01T212022-preImport.json', aside: '0 snippets', badge: h(K.Badge, { tone: 'warning' }, 'Pre-import') }),
        h(K.ListRow, { title: '1 Nov 2026, 20:53', meta: 'kudzu-backup-2026-11-01T205318-daily.json', aside: '0 snippets', badge: h(K.Badge, null, 'Daily') }))),
    h('div', { style: { display: 'flex', gap: 8, marginTop: 12 } }, h(K.Button, null, 'Restore…'), h(K.Button, { variant: 'ghost' }, 'Reveal in Finder')));
  if (sec === 'io') return h(Page, { title: 'Import & export', desc: 'Move snippets in from Espanso, or take your library anywhere.' },
    h(K.SettingsGroup, { title: 'Import', description: 'A backup is taken before every import.' },
      h(K.SettingsRow, { label: 'Espanso YAML', description: 'match/*.yml files' }, h(K.Button, { size: 'sm' }, 'Import…')),
      h(K.SettingsRow, { label: 'Kudzu JSON', description: 'A library exported from Kudzu' }, h(K.Button, { size: 'sm' }, 'Import…'))),
    h(K.SettingsGroup, { title: 'Export' },
      h(K.SettingsRow, { label: 'Kudzu JSON', description: 'Lossless: rules, stats and groups included' }, h(K.Button, { size: 'sm' }, 'Export…')),
      h(K.SettingsRow, { label: 'Espanso YAML', description: 'Triggers and content only' }, h(K.Button, { size: 'sm' }, 'Export…'))));
  if (sec === 'about') return h(Page, { title: 'About' },
    h('div', { style: { display: 'flex', flexDirection: 'column', gap: 4, padding: '8px 2px 24px' } },
      h('div', { style: { font: '600 28px/32px var(--font-sans)', letterSpacing: '-.02em' } }, 'Kudzu'),
      h('div', { style: { color: 'var(--ink-muted)' } }, 'A lightweight, native macOS text expander.'),
      h('div', { style: { font: '400 11px/14px var(--font-mono)', color: 'var(--ink-muted)', marginTop: 8 } }, 'Version 1.0 (1) · MIT License')),
    h(K.SettingsGroup, null,
      h(K.SettingsRow, { label: 'Source code', description: 'github.com/Stringsaeed/kudzu' }, h(K.Button, { size: 'sm', variant: 'ghost' }, 'Open')),
      h(K.SettingsRow, { label: 'Check for updates' }, h(K.Button, { size: 'sm' }, 'Check now'))));
  return h(Page, { title: 'General' },
    h(K.SettingsGroup, { title: 'Startup' },
      h(K.SettingsRow, { label: 'Launch Kudzu at login' }, h(K.Toggle, { checked: true, label: 'Launch Kudzu at login' }))),
    h(K.SettingsGroup, { title: 'Appearance' },
      h(K.SettingsRow, { label: 'Theme' }, h(K.Segmented, { options: ['System', 'Light', 'Dark'], label: 'Theme' }))),
    h(K.SettingsGroup, { title: 'Snippets & stats' },
      h(K.SettingsRow, { label: 'Typing speed', description: 'Used to estimate time saved.' }, h(K.Stepper, { value: 40, step: 5, min: 10, unit: 'wpm' })),
      h(K.SettingsRow, { label: 'Default trigger prefix', description: 'Added to new triggers you type.' }, h(K.TextInput, { mono: true, defaultValue: ';', style: { width: 56, textAlign: 'center' } }))),
    h(K.SettingsGroup, { title: 'Onboarding' },
      h(K.SettingsRow, { label: 'Setup assistant' }, h(K.Button, { size: 'sm' }, 'Show welcome again'))));
}

function App(props) {
  var vs = useState(props.view || 'all'), view = vs[0], setView = vs[1];
  var ss = useState(props.sel || 'an'), sel = ss[0], setSel = ss[1];
  var cs = useState(props.sec || 'general'), sec = cs[0], setSec = cs[1];
  function go(v) { setView(v); if (v === 'recent' || v === 'gs') setSel(null); }
  var isSettings = view === 'settings', isStats = view === 'stats';
  return h(K.AppShell, {
    sidebar: h(Sidebar, { view: view, go: go }),
    sidebarFooter: h(K.SidebarItem, { icon: 'sliders', label: 'Settings', shortcut: '⌘,', active: isSettings, onClick: function () { go('settings'); } }),
    list: isSettings ? h(SettingsList, { sec: sec, setSec: setSec }) : isStats ? h(StatsList) : h(SnippetList, { view: view, sel: sel, select: setSel }),
    detail: isSettings ? h(SettingsDetail, { sec: sec }) : isStats ? h(StatsDetail) : h(SnippetDetail, { sel: sel })
  });
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App, {"view": "settings", "sec": "general", "sel": "an"}));
</script>
</body>
</html>
