<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kudzu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400;500&display=swap">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:512px; height:288px; }
  .vine { fill:var(--vine); }
  .soft { fill:var(--vine-soft); }
  .deep { fill:var(--ink); }
  .bloom { fill:var(--bloom); }
  .blk { rx:var(--radius-lg); }
  .leaf { fill:var(--vine-ink); }
  .leaf.cut { fill:var(--vine-soft); }
  .words { position:absolute; left:var(--space-8); bottom:var(--space-8); max-width:440px; }
  .name { margin:0; font-size:112px; line-height:.9; font-weight:600; letter-spacing:-.035em; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 4px; font-size:14px; line-height:20px; color:var(--ink-muted); }
  .tag code { font:500 13px/20px var(--font-mono); color:var(--vine-ink); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 512 288" width="512" height="288">
<!--
  blocks      vine (chartreuse) 144x232 slab bled off the top (the identity colour, largest) · vine-soft 152x192 (relief) · ink 160x224 bleeding off the right edge · bloom 32px disc, once (favorites only) — about 40% of 960x288
  arrangement one tall vine slab with satellites, bottoms on one line space-6 above the edge, space-4 gutters
  pattern     literal motif: leaves (two quarter-rounds of radius = side) climbing up and right in space-4 and space-6 sizes, from "Kudzu is a vine; the app grows a little every time you type"; cut into the slab in vine-soft, in vine-ink across the tint, two escaping onto the ground
  scales      sides in space-2 multiples; gutters space-4; leaves space-4 / space-6; corners radius-lg; disc radius-full
-->
<rect class="vine blk" x="24" y="-16" width="144" height="232" rx="12"/>
<circle class="bloom" cx="40" cy="248" r="16"/>
<rect class="soft blk" x="184" y="72" width="152" height="192" rx="12"/>
<rect class="deep blk" x="352" y="40" width="176" height="224" rx="12"/>
<path class="leaf" d="M200 248 A16 16 0 0 1 216 232 A16 16 0 0 1 200 248 Z"/>
<path class="leaf" d="M224 232 A24 24 0 0 1 248 208 A24 24 0 0 1 224 232 Z"/>
<path class="leaf" d="M256 208 A16 16 0 0 1 272 192 A16 16 0 0 1 256 208 Z"/>
<path class="leaf" d="M240 184 A24 24 0 0 1 264 160 A24 24 0 0 1 240 184 Z"/>
<path class="leaf" d="M280 168 A16 16 0 0 1 296 152 A16 16 0 0 1 280 168 Z"/>
<path class="leaf" d="M264 144 A24 24 0 0 1 288 120 A24 24 0 0 1 264 144 Z"/>
<path class="leaf" d="M296 120 A16 16 0 0 1 312 104 A16 16 0 0 1 296 120 Z"/>
<path class="leaf" d="M280 96 A16 16 0 0 1 296 80 A16 16 0 0 1 280 96 Z"/>
<path class="leaf cut" d="M48 200 A24 24 0 0 1 72 176 A24 24 0 0 1 48 200 Z"/>
<path class="leaf cut" d="M88 168 A16 16 0 0 1 104 152 A16 16 0 0 1 88 168 Z"/>
<path class="leaf cut" d="M64 136 A16 16 0 0 1 80 120 A16 16 0 0 1 64 136 Z"/>
<path class="leaf cut" d="M112 120 A24 24 0 0 1 136 96 A24 24 0 0 1 112 120 Z"/>
<path class="leaf" d="M312 72 A16 16 0 0 1 328 56 A16 16 0 0 1 312 72 Z"/>
<path class="leaf" d="M336 40 A16 16 0 0 1 352 24 A16 16 0 0 1 336 40 Z"/>
</svg>
</div>
<div class="words">
<h1 class="name">Kudzu</h1>
<p class="tag">Type <code>:an</code>, get your name. A quiet, native text expander.</p>
</div>
</div>
</body>
</html>
