name: Kudzu
options:
  bundleIdPrefix: sh.saeed
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES

# Signing lives in an xcconfig so contributors can override it locally (see Config/).
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

packages:
  KudzuCore:
    path: Packages/KudzuCore
  KudzuUI:
    path: Packages/KudzuUI

targetTemplates:
  KudzuApp:
    type: application
    platform: macOS
    sources:
      - path: Kudzu
        excludes:
          - "**/.gitkeep"
          - "Resources/*.entitlements"
    dependencies:
      - package: KudzuCore
      - package: KudzuUI
    info:
      path: Kudzu/Resources/Info.plist
      properties:
        CFBundleDisplayName: Kudzu
        CFBundleName: Kudzu
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Muhammed Ibrahim. MIT License."
        # In-app drag type for moving snippets and groups in the sidebar.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: sh.saeed.kudzu.drag
            UTTypeDescription: Kudzu Library Item
            UTTypeConformsTo: [public.data]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.saeed.kudzu
        PRODUCT_NAME: Kudzu
        GENERATE_INFOPLIST_FILE: NO

targets:
  # Developer ID build: unsandboxed, Sparkle (M5), direct download + Homebrew.
  Kudzu:
    templates: [KudzuApp]
    entitlements:
      path: Kudzu/Resources/Kudzu.entitlements
      properties: {}

  # Mac App Store build: sandboxed, no Sparkle. Compiled with APPSTORE.
  KudzuAppStore:
    templates: [KudzuApp]
    entitlements:
      path: Kudzu/Resources/KudzuAppStore.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APPSTORE"
        # Distinct product so both builds can coexist; the user-visible name stays "Kudzu".
        PRODUCT_NAME: KudzuAppStore

  # Design-system gallery: every KudzuUI foundation and component on one page each.
  # `KudzuGallery --snapshot [dir]` renders the pages to PNG without opening a window.
  KudzuGallery:
    type: application
    platform: macOS
    sources:
      - path: Gallery
    dependencies:
      - package: KudzuUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.saeed.kudzu.gallery
        PRODUCT_NAME: KudzuGallery
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kudzu Gallery
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Muhammed Ibrahim. MIT License."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools

schemes:
  Kudzu:
    build:
      targets:
        Kudzu: all
    test:
      targets: []
  KudzuAppStore:
    build:
      targets:
        KudzuAppStore: all
  KudzuGallery:
    build:
      targets:
        KudzuGallery: all
    run:
      config: Debug
