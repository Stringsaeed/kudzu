name: Desktop v2
on:
  push:
    paths: ["apps/desktop-v2/**", ".github/workflows/desktop-v2.yml"]
  pull_request:
    paths: ["apps/desktop-v2/**", ".github/workflows/desktop-v2.yml"]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: xcode-27
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/desktop-v2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Engine tap-callback budget (optimized build)
        run: cargo test --release -p kudzu-engine latency
      # Ignored locally because it edits the keychain search list; a CI runner's keychain is disposable.
      - name: Installer rejects a self-signed bundle with the expected id and team
        run: cargo test -p kudzu-system -- --ignored a_self_signed_fixture_with_the_expected_id_and_team_is_rejected
      - run: cargo xtask check-deps
      - run: python3 scripts/check-design-assets.py
      - run: python3 -m unittest discover -s scripts/tests
      - name: Headless adapter isolation
        run: |
          cargo build
          python3 scripts/check-headless.py
