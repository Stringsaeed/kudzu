name: CI

on:
  pull_request:
    paths:
      [
        "apps/desktop/**",
        "apps/website/**",
        "packages/**",
        "package.json",
        "pnpm-lock.yaml",
        "pnpm-workspace.yaml",
        "turbo.json",
        ".github/workflows/ci.yml",
        ".github/workflows/build-macos.yml",
        ".github/workflows/release.yml",
      ]
  push:
    branches: [main]
    paths:
      [
        "apps/desktop/**",
        "apps/website/**",
        "packages/**",
        "package.json",
        "pnpm-lock.yaml",
        "pnpm-workspace.yaml",
        "turbo.json",
        ".github/workflows/ci.yml",
        ".github/workflows/build-macos.yml",
        ".github/workflows/release.yml",
      ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    # Keep this on the same image as the release build in build-macos.yml.
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile
      - name: Design exports
        working-directory: apps/desktop
        run: |
          python3 scripts/check-design-assets.py
          python3 -m unittest discover -s scripts/tests -p test_design_assets.py
      - name: Frontends (types, lint, production builds)
        run: |
          pnpm check
          pnpm --filter kudzu-desktop test:formatting
          pnpm --filter kudzu-website test:deployment
          pnpm build
      - name: Rust (clippy, tests)
        working-directory: apps/desktop/src-tauri
        run: |
          cargo clippy --workspace --exclude kudzu-app --all-targets -- -D warnings
          cargo test --workspace --exclude kudzu-app

  native:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: native
      - run: pnpm install --frozen-lockfile
      - name: Generated Rune assets
        working-directory: apps/desktop
        run: |
          node scripts/rune-tokens.mjs --check
          node scripts/rune-icons.mjs --check
      - name: Build and test the native app
        working-directory: apps/desktop/src-tauri
        run: |
          cargo build --locked -p kudzu-app
          cargo test --locked -p kudzu-app
