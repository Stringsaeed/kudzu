name: CI

on:
  pull_request:
    paths:
      [
        "apps/macos/**",
        "apps/website/**",
        "packages/**",
        "package.json",
        "pnpm-lock.yaml",
        "pnpm-workspace.yaml",
        "turbo.json",
        "release-please-config.json",
        ".release-please-manifest.json",
        ".github/workflows/ci.yml",
        ".github/workflows/release.yml",
        ".github/workflows/build-macos.yml",
      ]
  push:
    branches: [main]
    paths:
      [
        "apps/macos/**",
        "apps/website/**",
        "packages/**",
        "package.json",
        "pnpm-lock.yaml",
        "pnpm-workspace.yaml",
        "turbo.json",
        "release-please-config.json",
        ".release-please-manifest.json",
        ".github/workflows/ci.yml",
        ".github/workflows/release.yml",
        ".github/workflows/build-macos.yml",
      ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Website lint, types, build, preview filter
        run: |
          pnpm exec turbo run lint typecheck --filter=kudzu-website
          pnpm --filter kudzu-website test:deployment
          pnpm exec turbo run build --filter=kudzu-website

  macos:
    # Same image as the release build. Branch protection must require this job
    # name (`macos`). The previous required check was `desktop`.
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          if [[ "$(xcode-select -p)" != *.app/* && "$(xcode-select -p)" != *.app ]]; then
            echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> "$GITHUB_ENV"
          fi
      - name: Design exports
        working-directory: apps/macos
        run: |
          python3 scripts/design/check-design-assets.py
          python3 -m unittest discover -s scripts/design -p 'test_design_assets.py'
      - name: Swift tests
        working-directory: apps/macos/Packages/KudzuKit
        run: swift test
      - name: Release compile (host architecture)
        working-directory: apps/macos
        run: |
          xcodebuild \
            -project Kudzu.xcodeproj \
            -scheme Kudzu \
            -configuration Release \
            -destination "platform=macOS" \
            -derivedDataPath "${{ runner.temp }}/kudzu-ci" \
            build \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=YES
