name: Desktop v2 release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
# Not `release`: the frozen release.yml and beta.yml share that group, and GitHub keeps one running
# and one pending run per group, so a long candidate could block or cancel a real release.
concurrency:
  group: desktop-v2-release
  cancel-in-progress: false
jobs:
  candidate:
    # The production secrets reach whichever ref is dispatched, so only these refs may run.
    if: github.ref == 'refs/heads/t3/rune-migration-plan' || github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/desktop-v2
    steps:
      # Every action is pinned to a full commit SHA; the comment names the release it is.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: create-dmg/create-dmg
          ref: 994a036532d3ac1bb1cd5a425a0d5d796ecbed83 # v1.2.3
          path: apps/desktop-v2/target/create-dmg-tool
          persist-credentials: false
      - name: Packaging tool
        run: echo "$PWD/target/create-dmg-tool" >> "$GITHUB_PATH"
      # The profile is not a signing secret, but it stays out of the repository tree.
      - name: Prepare provisioning profile
        env:
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/kudzu-release"
          if [[ -n "$APPLE_PROVISIONING_PROFILE" ]]; then
            printf '%s' "$APPLE_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/kudzu-release/Kudzu.provisionprofile"
            echo "KUDZU_PROVISIONING_PROFILE=$RUNNER_TEMP/kudzu-release/Kudzu.provisionprofile" >> "$GITHUB_ENV"
          fi
      # Compile the release tool and its dependencies (build scripts, proc macros) with no secrets
      # in the environment. The next steps run the finished binary, so cargo and rustc never run
      # with a credential present.
      - name: Build the release tool
        run: cargo build --locked -p xtask
      # xtask reads these once, removes them from its environment, and builds the universal bundle
      # before the certificate is imported, so no build script ever sees a credential.
      - name: Build, sign, notarize, staple and verify
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          KUDZU_UPDATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          KUDZU_UPDATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          REQUIRE_ICLOUD: '1'
        run: target/debug/xtask release
      - name: Clean up and prove keychain removal
        if: always()
        run: |
          trap 'rm -rf "$RUNNER_TEMP/kudzu-release"' EXIT
          # No binary means no release stage ran, so there is no keychain to recover.
          if [[ -x target/debug/xtask ]]; then target/debug/xtask release cleanup; fi
          if find "$RUNNER_TEMP" target -name release.keychain-db -print 2>/dev/null | grep -q .; then
            echo 'release keychain remains' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-v2-candidate-${{ github.sha }}
          path: apps/desktop-v2/dist/
          if-no-files-found: error
          # Run artifacts are public for the repository's readers. Keep a candidate briefly.
          retention-days: 7
