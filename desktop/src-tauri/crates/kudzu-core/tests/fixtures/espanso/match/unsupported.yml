# Unsupported or partially degraded Espanso features
matches:
  - regex: ":greet\\((?P<person>.*)\\)"
    replace: "Hi {{person}}!"

  - trigger: ":cat"
    image_path: "$CONFIG/images/cat.png"

  - trigger: ":rich_md"
    markdown: "This *text* is **bold**"

  - trigger: ":rich_html"
    html: "<p>Hello <b>world</b></p>"

  - trigger: ":ip"
    replace: "IP: {{output}}"
    vars:
      - name: output
        type: shell
        params:
          cmd: "curl https://api.ipify.org"

  - trigger: ":py"
    replace: "Out: {{script_out}}"
    vars:
      - name: script_out
        type: script
        params:
          args: ["python", "script.py"]

  - trigger: ":rand"
    replace: "Quote: {{r}}"
    vars:
      - name: r
        type: random
        params:
          choices: ["One", "Two"]

  - trigger: ":echo_test"
    replace: "Echo: {{e}}"
    vars:
      - name: e
        type: echo
        params:
          echo: "Fixed"

  - trigger: ":broken_nest"
    replace: "Missing: {{missing_match}}"
    vars:
      - name: missing_match
        type: match
        params:
          trigger: ":nonexistent_trigger"

  - trigger: ":weird_date"
    replace: "{{wd}}"
    vars:
      - name: wd
        type: date
        params:
          format: "%Y-%V-%u"
